<script>
(function(){
const {useState,useEffect,useMemo,useRef} = React;
const html = htm.bind(React.createElement);

/* ---------- helpers ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const dotDate = s => s ? s.replace(/-/g,'.') : '';
const STAGES = ['시공전','시공중','시공후'];
const TRADES = ['건축','인테리어','전기','설비','소방','통신','기계','조경','토목','철거','도장','방수'];

/* ---------- storage: account (db + assets) or this device (IndexedDB) ---------- */
function cloudStore(col, assets){
  return {
    mode:'cloud',
    subscribe(fn, onErr){ return col.onSnapshot(s => fn(s.docs.map(d => ({...d.data(), id:d.id}))), e => onErr && onErr(e)); },
    put(rec){ const {id, ...data} = rec; return col.doc(id).set(data); },
    del(id){ return col.doc(id).delete(); },
    async addBlob(blob){ const r = await assets.upload(blob, {type:'image/jpeg'}); return r.id; },
    async delBlob(aid){ try{ await assets.delete(aid); }catch(e){} },
    urlSync(aid){ return '/_blob/' + aid; },
    async url(aid){ return '/_blob/' + aid; }
  };
}
function openIDB(){
  return new Promise((res, rej) => {
    try{
      const r = indexedDB.open('site-photo-log', 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('recs', {keyPath:'id'}); r.result.createObjectStore('blobs'); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    }catch(e){ rej(e); }
  });
}
async function localStore(){
  let db = null; try{ db = await openIDB(); }catch(e){}
  const mem = {recs:new Map(), blobs:new Map()}, urls = new Map(); let listener = null;
  const tx = (store, mode, op) => new Promise((res, rej) => {
    const t = db.transaction(store, mode); const req = op(t.objectStore(store));
    t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error);
  });
  const all = async () => db ? (await tx('recs','readonly', s => s.getAll())) : [...mem.recs.values()];
  const emit = async () => { if(listener) listener(await all()); };
  return {
    mode: db ? 'local' : 'memory',
    subscribe(fn){ listener = fn; emit(); return () => { listener = null; }; },
    async put(rec){ if(db) await tx('recs','readwrite', s => s.put(rec)); else mem.recs.set(rec.id, rec); emit(); },
    async del(id){ if(db) await tx('recs','readwrite', s => s.delete(id)); else mem.recs.delete(id); emit(); },
    async addBlob(blob){ const id = uid(); if(db) await tx('blobs','readwrite', s => s.put(blob, id)); else mem.blobs.set(id, blob); urls.set(id, URL.createObjectURL(blob)); return id; },
    async delBlob(id){ if(db) await tx('blobs','readwrite', s => s.delete(id)); else mem.blobs.delete(id); },
    urlSync(id){ return urls.get(id) || null; },
    async url(id){
      if(urls.has(id)) return urls.get(id);
      const b = db ? await tx('blobs','readonly', s => s.get(id)) : mem.blobs.get(id);
      if(!b) return null; const u = URL.createObjectURL(b); urls.set(id, u); return u;
    }
  };
}
async function initStore(){
  const use = n => (window.claude && window.claude.use) ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  const [db, assets, user] = await Promise.all([use('db'), use('assets'), use('user')]);
  if(db && assets && user){
    try{ const id = await user.id(); if(id) return cloudStore(db.collection('data/users/' + id), assets); }catch(e){}
  }
  return localStore();
}

/* ---------- image prep ---------- */
function loadImg(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function prepImage(file){
  let src;
  try{ src = await createImageBitmap(file, {imageOrientation:'from-image'}); }
  catch(e){ const u = URL.createObjectURL(file); src = await loadImg(u); }
  const iw = src.width || src.naturalWidth, ih = src.height || src.naturalHeight;
  const s = Math.min(1, 1800 / Math.max(iw, ih));
  const w = Math.round(iw * s), h = Math.round(ih * s);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(src, 0, 0, w, h);
  if(src.close) src.close();
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.86));
  return {blob, w, h};
}
async function bitmapFrom(url){
  try{ const b = await (await fetch(url)).blob(); return await createImageBitmap(b); }
  catch(e){ return await loadImg(url); }
}

/* ---------- PDF rendering (canvas pages → jsPDF) ---------- */
const PW = 1240, PH = 1754, S = 1.5, M = 70;
const FONT = '"IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const INK = '#111417', LABEL_BG = '#EEF0EC';
async function fontsReady(){
  try{ await Promise.all([document.fonts.load(`700 40px ${FONT}`,'현장'), document.fonts.load(`500 24px ${FONT}`,'공종'), document.fonts.load(`400 24px ${FONT}`,'내용')]); }catch(e){}
}
function fit(g, t, w){ t = String(t || ''); if(g.measureText(t).width <= w) return t; while(t && g.measureText(t + '…').width > w) t = t.slice(0, -1); return t + '…'; }
function wrap(g, text, w, maxLines){
  const out = [];
  for(const para of String(text || '').split('\n')){
    let line = '';
    for(const ch of para){ if(line && g.measureText(line + ch).width > w){ out.push(line); line = ch.trim() ? ch : ''; } else line += ch; }
    out.push(line);
  }
  if(out.length > maxLines){ const k = out.slice(0, maxLines); k[maxLines-1] = fit(g, k[maxLines-1] + '        ', w).replace(/\s+…$/,'…'); return k; }
  return out;
}
function cellLabel(g, x, y, w, h, label){
  g.fillStyle = LABEL_BG; g.fillRect(x, y, w, h);
  g.fillStyle = INK; g.font = `600 22px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(label, x + w/2, y + h/2); g.textAlign = 'left';
}
function cellText(g, x, y, w, h, text, size){
  g.fillStyle = INK; g.font = `400 ${size||22}px ${FONT}`; g.textBaseline = 'middle';
  g.fillText(fit(g, text, w - 24), x + 12, y + h/2);
}
function box(g, x, y, w, h, lw){ g.lineWidth = lw || 1.5; g.strokeStyle = INK; g.strokeRect(x, y, w, h); }
function hline(g, x1, x2, y){ g.beginPath(); g.moveTo(x1, y); g.lineTo(x2, y); g.lineWidth = 1.5; g.strokeStyle = INK; g.stroke(); }
function vline(g, x, y1, y2){ g.beginPath(); g.moveTo(x, y1); g.lineTo(x, y2); g.lineWidth = 1.5; g.strokeStyle = INK; g.stroke(); }
function drawPhoto(g, img, x, y, w, h, mode, no){
  g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip();
  g.fillStyle = '#F1F2F0'; g.fillRect(x, y, w, h);
  if(img){
    const iw = img.width || img.naturalWidth, ih = img.height || img.naturalHeight;
    const s = mode === 'contain' ? Math.min(w/iw, h/ih) : Math.max(w/iw, h/ih);
    g.drawImage(img, x + (w - iw*s)/2, y + (h - ih*s)/2, iw*s, ih*s);
  }
  if(no){
    g.font = `500 18px ${FONT}`; const t = 'No. ' + no; const tw = g.measureText(t).width;

function drawHeader(g, site, title, page, pages){

function drawFooter(g, page){

function blockSide(g, p, img, x, y, w, h, mode, no){
  const pw = Math.round(w * 0.63), tx = x + pw, tw = w - pw, lw = 96, rh = 54;
  drawPhoto(g, img, x, y, pw, h, mode, no);
  box(g, tx, y, tw, h, 1.5); vline(g, tx + lw, y, y + h);
  const rows = [['공 종', p.trade], ['위 치', p.location], ['공 정', p.stage], ['일 자', dotDate(p.date)]];
  rows.forEach((r, i) => { const ry = y + i*rh; cellLabel(g, tx+1, ry+1, lw-2, rh-2, r[0]); cellText(g, tx + lw, ry, tw - lw, rh, r[1]); hline(g, tx, tx + tw, ry + rh); });
  const ny = y + rows.length*rh, nh = h - rows.length*rh;
  cellLabel(g, tx+1, ny+1, lw-2, nh-2, '내 용');
  g.font = `400 21px ${FONT}`; g.fillStyle = INK; g.textBaseline = 'top';
  const lines = wrap(g, p.note, tw - lw - 24, Math.max(1, Math.floor((nh - 20) / 31)));

function blockBelow(g, p, img, x, y, w, h, mode, no){
  const rh = 50, th = rh*3, ph = h - th, lw = 110, half = w/2;

  cellLabel(g, x+1, ty+1, lw-2, rh-2, '공 종'); cellText(g, x + lw, ty, half - lw, rh, p.trade);
  cellLabel(g, x+half+1, ty+1, lw-2, rh-2, '위 치'); cellText(g, x + half + lw, ty, half - lw, rh, p.location);
  cellLabel(g, x+1, ty+rh+1, lw-2, rh-2, '공 정'); cellText(g, x + lw, ty + rh, half - lw, rh, p.stage);
  cellLabel(g, x+half+1, ty+rh+1, lw-2, rh-2, '일 자'); cellText(g, x + half + lw, ty + rh, half - lw, rh, dotDate(p.date));

function blockGrid(g, p, img, x, y, w, h, mode, no){
  const ch = 82, ph = h - ch;
  drawPhoto(g, img, x, y, w, ph, mode, no);

  g.fillStyle = INK; g.textBaseline = 'top';
  g.font = `600 21px ${FONT}`; g.fillText(fit(g, [p.trade, p.location].filter(Boolean).join(' · ') || '공종·위치 미입력', w - 24), x + 12, y + ph + 12);
  g.font = `400 19px ${FONT}`; g.fillStyle = '#3B4247';
  g.fillText(fit(g, [p.stage, dotDate(p.date), (p.note || '').replace(/\n/g,' ')].filter(Boolean).join(' · '), w - 24), x + 12, y + ph + 46);
}
async function renderPages(site, photos, opts, urlOf, onProgress){
  await fontsReady();
  const per = {side:3, below:2, grid6:6}[opts.layout];
  const groups = []; for(let i = 0; i < photos.length; i += per) groups.push(photos.slice(i, i + per));
  const out = [];
  for(let pi = 0; pi < groups.length; pi++){
    const c = document.createElement('canvas'); c.width = PW*S; c.height = PH*S;
    const g = c.getContext('2d'); g.scale(S, S);
    g.fillStyle = '#fff'; g.fillRect(0, 0, PW, PH);
    const top = drawHeader(g, site, opts.title, pi + 1, groups.length);
    const bottom = PH - M - 10, gap = 22, W = PW - 2*M;
    const imgs = await Promise.all(groups[pi].map(async p => { try{ const u = await urlOf(p.asset); return u ? await bitmapFrom(u) : null; }catch(e){ return null; } }));
    groups[pi].forEach((p, k) => {
      const no = pi*per + k + 1;
      if(opts.layout === 'grid6'){
        const cw = (W - gap)/2, chh = (bottom - top - gap*2)/3;
        blockGrid(g, p, imgs[k], M + (k%2)*(cw + gap), top + Math.floor(k/2)*(chh + gap), cw, chh, opts.fit, no);
      } else {
        const n = per, bh = (bottom - top - gap*(n-1))/n;
        (opts.layout === 'side' ? blockSide : blockBelow)(g, p, imgs[k], M, top + k*(bh + gap), W, bh, opts.fit, no);
      }
    });
    imgs.forEach(i => i && i.close && i.close());
    drawFooter(g, pi + 1);
    out.push(c.toDataURL('image/jpeg', 0.88));
    onProgress && onProgress((pi + 1) / groups.length);
    await new Promise(r => setTimeout(r, 0));
  }
  return out;
}

function ExportSheet({store, site, photos, selected, onClose, toast}){
  const [layout, setLayout] = useState('side');

    return pdf;
  };
  const fileName = () => `${(site.name || '현장').replace(/[\\/:*?"<>|]/g,' ').trim()}_사진대지_${today().replace(/-/g,'')}.pdf`;
  function nativeOut(kind){

    ${pages ? html`
      ${!NATIVE && downloads === null && html`<p class="note">이 화면에서는 파일 저장을 쓸 수 없어요. claude.ai 앱이나 웹에서 열어 주세요.</p>`}

          ${[['side','3장','사진 옆에 표'],['below','2장','사진 아래 표'],['grid6','6장','격자형']].map(([k, a, b]) => html`
            <button type="button" key=${k} class=${'lay' + (layout === k ? ' on' : '')} aria-pressed=${layout === k} onClick=${() => reset(setLayout)(k)}>
              <span class=${'mini ' + k}>${Array.from({length:{side:3,below:2,grid6:6}[k]}, (_, i) => html`<i key=${i}></i>`)}</span>
              <span>쪽당 ${a}</span><small>${b}</small></button>`)}
        </div></div>
      <div class="field"><label>넣을 사진</label>
        <div class="sugg">
          <button type="button" class=${'chip' + (range === 'all' ? ' on' : '')} onClick=${() => setRange('all')}>전체 <span class="n">${photos.length}</span></button>
          ${selected.length > 0 && html`<button type="button" class=${'chip' + (range === 'sel' ? ' on' : '')} onClick=${() => setRange('sel')}>선택한 사진 <span class="n">${selected.length}</span></button>`}
          ${stageCounts.map(([s, n]) => html`<button type="button" key=${s} class=${'chip' + (range === s ? ' on' : '')} onClick=${() => setRange(s)}>${s} <span class="n">${n}</span></button>`)}
        </div></div>
      <div class="field"><label>사진 맞춤</label>
        <div class="seg" style=${{gridTemplateColumns:'1fr 1fr'}}>
          <button type="button" class=${fitMode === 'cover' ? 'on' : ''} onClick=${() => setFit('cover')}>칸에 꽉 채우기</button>
          <button type="button" class=${fitMode === 'contain' ? 'on' : ''} onClick=${() => setFit('contain')}>잘리지 않게</button>
        </div></div>
      <div class="field"><label for="ex-title">문서 제목</label><input id="ex-title" class="inp" value=${title} onChange=${e => setTitle(e.target.value)} /></div>
      ${busy > 0 && html`<div class="progress" aria-label="진행률"><i style=${{width: Math.round(busy*100) + '%'}}></i></div>`}
      <p class="note">A4 세로 · 사진 순서대로 No.가 붙어요.</p>`}
  <//>`;
}

function Confirm({title, body, action, onYes, onClose}){
  return html`<${Sheet} title=${title} onClose=${onClose}
    foot=${html`<button class="btn" onClick=${onClose}>취소</button><button class="btn primary" style=${{background:'var(--danger)', borderColor:'var(--danger)', color:'#fff'}} onClick=${onYes}>${action}</button>`}>
    <p style=${{margin:0}}>${body}</p><//>`;
}

/* ---------- screens ---------- */
function SiteList({store, sites, photosBy, onOpen, onNew}){
  if(!sites.length) return html`<div class="empty">
    <div class="sheet-mock" aria-hidden="true"><div class="t"></div>${[0,1,2].map(i => html`<div class="row" key=${i}><div class="ph"></div><div class="tb"><i></i><i></i><i></i><i></i></div></div>`)}</div>
    <h2>현장을 만들고 사진을 찍어 보세요</h2>
    <p>사진마다 공종·위치·공정·내용을 적어 두면 A4 사진대지 PDF로 바로 만들어져요.</p>
    <button class="btn primary" onClick=${onNew}>${Icon.plus} 첫 현장 만들기</button></div>`;
  return html`<div>
    <div class="section-label">현장 ${sites.length}곳</div>
    <div class="sites">${sites.map(s => {
      const ps = photosBy[s.id] || []; const cover = ps[ps.length - 1];
      return html`<button class="site" key=${s.id} onClick=${() => onOpen(s.id)}>
        <div class="thumb">${cover ? html`<${Photo} store=${store} aid=${cover.asset} />` : Icon.camera}</div>
        <div class="site-body">
          <div class="site-name">${s.name}</div>
          <div class="site-sub">${[s.client, s.address].filter(Boolean).join(' · ') || '발주처·주소 미입력'}</div>
          <div class="meta"><span class="tag">사진 <b>${ps.length}</b>장</span>
            ${(s.start || s.end) && html`<span class="tag">${dotDate(s.start)} ~ ${dotDate(s.end)}</span>`}</div>
        </div></button>`; })}
    </div></div>`;
}

function SiteScreen({store, site, photos, filter, setFilter, selectMode, selected, toggleSel, onOpenPhoto}){
  const counts = Object.fromEntries(STAGES.map(s => [s, photos.filter(p => p.stage === s).length]));
  const shown = filter === 'all' ? photos : photos.filter(p => p.stage === filter);
  const numberOf = useMemo(() => Object.fromEntries(photos.map((p, i) => [p.id, i + 1])), [photos]);
  return html`<div>
    <div class="site-head">
      <div class="sub">${[site.client && '발주처 ' + site.client, site.contractor && '시공사 ' + site.contractor].filter(Boolean).join(' · ')}</div>
      ${(site.address || site.start) && html`<div class="sub">${[site.address, (site.start || site.end) && `${dotDate(site.start)} ~ ${dotDate(site.end)}`].filter(Boolean).join(' · ')}</div>`}
    </div>
    <div class="filters" role="tablist">
      <button class=${'chip' + (filter === 'all' ? ' on' : '')} onClick=${() => setFilter('all')}>전체 <span class="n">${photos.length}</span></button>
      ${STAGES.map(s => html`<button key=${s} class=${'chip' + (filter === s ? ' on' : '')} onClick=${() => setFilter(s)}>${s} <span class="n">${counts[s]}</span></button>`)}
    </div>
    ${shown.length ? html`<div class="grid">${shown.map(p => html`
      <button key=${p.id} class=${'tile' + (selected.includes(p.id) ? ' sel' : '')} onClick=${() => selectMode ? toggleSel(p.id) : onOpenPhoto(p.id)}
        aria-label=${`사진 ${numberOf[p.id]} ${p.trade || ''} ${p.location || ''}`}>
        <div class="img"><${Photo} store=${store} aid=${p.asset} />
          <span class="no">No.${numberOf[p.id]}</span>
          ${p.stage && html`<span class=${'stage st-' + p.stage}>${p.stage}</span>`}
          ${selectMode && html`<span class="check">${selected.includes(p.id) && Icon.check}</span>`}</div>
        <div class="cap"><b>${[p.trade, p.location].filter(Boolean).join(' · ') || html`<span class="muted-i">정보 입력 전</span>`}</b>
          <span>${[dotDate(p.date), p.note].filter(Boolean).join(' · ')}</span></div>
      </button>`)}</div>`
    : html`<div class="hint">${photos.length ? `${filter} 사진이 없어요` : '아래 카메라 또는 앨범 버튼으로 사진을 추가하세요'}</div>`}
  </div>`;
}

/* ---------- app ---------- */
function App(){
  const [store, setStore] = useState(null);
  const [recs, setRecs] = useState(null);
  const [err, setErr] = useState('');
  const [screen, setScreen] = useState({name:'list'});
  const [sheet, setSheet] = useState(null);
  const [filter, setFilter] = useState('all');
  const [selectMode, setSelectMode] = useState(false);
  const [selected, setSelected] = useState([]);
  const [toastMsg, setToastMsg] = useState('');
  const toastT = useRef(null);
  const camRef = useRef(null), albRef = useRef(null);
  const toast = m => { setToastMsg(m); clearTimeout(toastT.current); toastT.current = setTimeout(() => setToastMsg(''), 2600); };

  useEffect(() => {
    let unsub = null, done = false;
    const timer = setTimeout(() => { if(!done) setErr('저장소 연결이 늦어지고 있어요. 잠시 후 다시 열어 주세요.'); }, 12000);
    initStore().then(s => { setStore(s); unsub = s.subscribe(list => { done = true; clearTimeout(timer); setErr(''); setRecs(list); }, e => { done = true; clearTimeout(timer); setErr('저장된 내용을 불러오지 못했어요.'); setRecs(r => r || []); }); });
    return () => { unsub && unsub(); clearTimeout(timer); };
  }, []);

  const sites = useMemo(() => (recs || []).filter(r => r.kind === 'site').sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0)), [recs]);
  const photosBy = useMemo(() => { const m = {}; (recs || []).filter(r => r.kind === 'photo').forEach(p => (m[p.siteId] = m[p.siteId] || []).push(p)); Object.values(m).forEach(a => a.sort((x, y) => x.order - y.order)); return m; }, [recs]);
  const site = screen.name === 'site' ? sites.find(s => s.id === screen.id) : null;
  const photos = site ? (photosBy[site.id] || []) : [];
  const uniq = (arr, base) => [...new Set([...arr.filter(Boolean).reverse(), ...(base || [])])].slice(0, 12);
  const recentTrades = uniq(photos.map(p => p.trade), TRADES);
  const recentLocs = uniq(photos.map(p => p.location));

  useEffect(() => { if(screen.name === 'site' && recs && !site) setScreen({name:'list'}); }, [recs, site]);

  const touchSite = s => store.put({...s, updatedAt: Date.now()});
  async function saveSite(f){
    const now = Date.now();
    if(f.id){ await store.put({...f, kind:'site', updatedAt:now}); toast('저장했어요'); }
    else { const id = uid(); await store.put({...f, id, kind:'site', createdAt:now, updatedAt:now}); setScreen({name:'site', id}); }
    setSheet(null);
  }
  async function deleteSite(s){
    const ps = photosBy[s.id] || [];
    setSheet(null); setScreen({name:'list'});
    for(const p of ps){ await store.del(p.id); store.delBlob(p.asset); }
    await store.del(s.id); toast('현장을 삭제했어요');
  }
  async function addFiles(files, openAfter){
    files = [...files].filter(f => f.type.startsWith('image/') || /\.(jpe?g|png|webp|heic)$/i.test(f.name));
    if(!files.length || !site) return;
    const last = photos[photos.length - 1] || {};
    let order = (last.order || 0) + 1, added = [], fail = 0;
    for(let i = 0; i < files.length; i++){
      if(files.length > 1) toast(`사진 올리는 중 ${i + 1}/${files.length}`);
      try{
        const {blob, w, h} = await prepImage(files[i]);
        const asset = await store.addBlob(blob);
        const lm = files[i].lastModified ? new Date(files[i].lastModified) : new Date();
        const rec = {id:uid(), kind:'photo', siteId:site.id, asset, w, h, order:order++, trade:last.trade || '', location:last.location || '', stage:last.stage || '', date:ymd(lm), note:'', createdAt:Date.now()};
        await store.put(rec); added.push(rec);
      }catch(e){ fail++; }
    }
    if(added.length) touchSite(site);
    toast(fail ? `${added.length}장 추가, ${fail}장 실패` : `${added.length}장 추가했어요`);
    if(openAfter && added.length === 1) setSheet({type:'photo', id:added[0].id});
  }
  const savePhoto = p => store.put(p);
  async function movePhoto(p, dir){
    const i = photos.findIndex(x => x.id === p.id), j = i + dir; if(j < 0 || j >= photos.length) return;
    const q = photos[j];
    await Promise.all([store.put({...p, order:q.order}), store.put({...q, order:p.order})]);
  }
  async function deletePhotos(ids){
    for(const id of ids){ const p = photos.find(x => x.id === id); if(p){ await store.del(p.id); store.delBlob(p.asset); } }
    setSelected([]); setSelectMode(false); setSheet(null); toast(`${ids.length}장 삭제했어요`);
  }
  async function batchApply(v){
    const ps = photos.filter(p => selected.includes(p.id));
    await Promise.all(ps.map(p => store.put({...p, ...(v.trade ? {trade:v.trade} : {}), ...(v.location ? {location:v.location} : {}), ...(v.stage !== null ? {stage:v.stage} : {}), ...(v.date ? {date:v.date} : {})})));
    setSheet(null); setSelectMode(false); setSelected([]); toast(`${ps.length}장 수정했어요`);
  }
  const toggleSel = id => setSelected(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);
  const openSite = id => { setScreen({name:'site', id}); setFilter('all'); setSelectMode(false); setSelected([]); window.scrollTo(0, 0); };

  const backRef = useRef(null);
  backRef.current = () => {
    if(sheetStack.length){ sheetStack[sheetStack.length - 1](); return true; }
    if(selectMode){ setSelectMode(false); setSelected([]); return true; }
    if(screen.name === 'site'){ setScreen({name:'list'}); return true; }
    return false;
  };
  useEffect(() => { window.__onBack = () => backRef.current(); }, []);

  if(!recs) return html`<div class="loading"><div class="spin"></div>${err || '불러오는 중'}</div>`;

  return html`<${React.Fragment}>
    <header class="top"><div class="wrap">
      ${site ? html`
        <button class="icon-btn" aria-label="현장 목록으로" onClick=${() => { setScreen({name:'list'}); setSelectMode(false); setSelected([]); }}>${Icon.back}</button>
        <h1>${site.name}</h1>
        ${photos.length > 0 && html`<button class="btn ghost" onClick=${() => { setSelectMode(!selectMode); setSelected([]); }}>${selectMode ? '선택 끝' : '선택'}</button>`}
        <button class="icon-btn" aria-label="현장 정보 수정" onClick=${() => setSheet({type:'site'})}>${Icon.edit}</button>`
      : html`
        <div class="brand"><span class="mark">${Icon.mark}</span>현장 사진대지</div>
        <span class="spacer"></span>
        ${!NATIVE && html`<span class="mode"><span class=${'dot' + (store.mode === 'cloud' ? '' : ' warn')}></span>${store.mode === 'cloud' ? '계정에 저장' : store.mode === 'local' ? '이 기기에만 저장' : '임시 저장'}</span>`}
        ${sites.length > 0 && html`<button class="btn primary" onClick=${() => setSheet({type:'newsite'})}>${Icon.plus} 새 현장</button>`}`}
    </div></header>

    <main><div class="wrap">
      ${err && html`<p class="note" role="status">${err}</p>`}
      ${site ? html`<${SiteScreen} store=${store} site=${site} photos=${photos} filter=${filter} setFilter=${setFilter} selectMode=${selectMode} selected=${selected} toggleSel=${toggleSel} onOpenPhoto=${id => setSheet({type:'photo', id})} />`
        : html`<${SiteList} store=${store} sites=${sites} photosBy=${photosBy} onOpen=${openSite} onNew=${() => setSheet({type:'newsite'})} />`}
    </div></main>

    ${site && html`<nav class="bar" aria-label="사진 작업"><div class="wrap">
      ${selectMode ? html`
        <span class="count">${selected.length}장</span>
        <button class="btn" disabled=${!selected.length} onClick=${() => setSheet({type:'batch'})}>한꺼번에 수정</button>
        <button class="btn" disabled=${!selected.length} onClick=${() => setSheet({type:'export'})}>${Icon.pdf} PDF</button>
        <button class="btn danger" disabled=${!selected.length} onClick=${() => setSheet({type:'confirm-photos'})}>삭제</button>`
      : html`
        <button class="btn primary" onClick=${() => camRef.current.click()}>${Icon.camera} 카메라</button>
        <button class="btn" onClick=${() => albRef.current.click()}>${Icon.album} 앨범</button>
        <button class="btn" disabled=${!photos.length} onClick=${() => setSheet({type:'export'})}>${Icon.pdf} PDF</button>`}
    </div></nav>`}
    <input ref=${camRef} id="cam-input" class="hidden-input" type="file" accept="image/*" capture="environment" tabIndex="-1" aria-hidden="true" onChange=${e => { addFiles(e.target.files, true); e.target.value = ''; }} />
    <input ref=${albRef} id="album-input" class="hidden-input" type="file" accept="image/*" multiple tabIndex="-1" aria-hidden="true" onChange=${e => { addFiles(e.target.files, false); e.target.value = ''; }} />

    ${sheet && sheet.type === 'newsite' && html`<${SiteForm} onSave=${saveSite} onClose=${() => setSheet(null)} />`}
    ${sheet && sheet.type === 'site' && site && html`<${SiteForm} site=${site} onSave=${saveSite} onDelete=${() => setSheet({type:'confirm-site'})} onClose=${() => setSheet(null)} />`}
    ${sheet && sheet.type === 'confirm-site' && site && html`<${Confirm} title="현장 삭제" body=${`'${site.name}' 현장과 사진 ${photos.length}장을 모두 지워요. 되돌릴 수 없어요.`} action="삭제" onYes=${() => deleteSite(site)} onClose=${() => setSheet(null)} />`}
    ${sheet && sheet.type === 'confirm-photos' && html`<${Confirm} title="사진 삭제" body=${`선택한 사진 ${selected.length}장을 지워요. 되돌릴 수 없어요.`} action="삭제" onYes=${() => deletePhotos(selected)} onClose=${() => setSheet(null)} />`}
    ${sheet && sheet.type === 'confirm-photo' && html`<${Confirm} title="사진 삭제" body="이 사진을 지워요. 되돌릴 수 없어요." action="삭제" onYes=${() => deletePhotos([sheet.id])} onClose=${() => setSheet({type:'photo', id:sheet.id})} />`}
    ${sheet && sheet.type === 'photo' && html`<${PhotoEditor} key="pe" store=${store} photos=${photos} startId=${sheet.id} recentTrades=${recentTrades} recentLocs=${recentLocs}
        onSave=${savePhoto} onMove=${movePhoto} onDelete=${p => setSheet({type:'confirm-photo', id:p.id})} onClose=${() => setSheet(null)} />`}
    ${sheet && sheet.type === 'batch' && html`<${BatchEdit} count=${selected.length} recentTrades=${recentTrades} recentLocs=${recentLocs} onApply=${batchApply} onClose=${() => setSheet(null)} />`}
    ${sheet && sheet.type === 'export' && site && html`<${ExportSheet} store=${store} site=${site} photos=${photos} selected=${selectMode ? selected : []} toast=${toast} onClose=${() => setSheet(null)} />`}
    ${toastMsg && html`<div class="toast" role="status">${toastMsg}</div>`}
  <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>

</body></html>
