<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14181B">
<title>상규 도면뷰어</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- 첫 화면 -->
<main id="home">
  <div class="home-in">
    <div class="brand">
      <svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><rect x="2" y="2" width="44" height="44" rx="11" fill="#F0B400"/><path d="M12 34V14h12l12 12v8z" fill="none" stroke="#14181B" stroke-width="3" stroke-linejoin="round"/><path d="M24 14v12h12" fill="none" stroke="#14181B" stroke-width="3" stroke-linejoin="round"/><path d="M12 38h24" stroke="#14181B" stroke-width="3" stroke-linecap="round"/></svg>
      <div>
        <h1>상규 도면뷰어</h1>
        <p class="sub">DWG · DXF 보기 · 거리/면적 재기 · PDF로 저장</p>
      </div>
    </div>
    <button id="btnOpen" class="big">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      도면 파일 열기
    </button>
    <section>
      <h2>최근 도면</h2>
      <ul id="recent" class="recent"></ul>
      <p id="recentEmpty" class="empty">아직 연 도면이 없어요.</p>
    </section>
    <div class="tip">
      <b>카톡으로 받은 도면</b>은 파일을 누른 뒤 <b>다른 앱으로 열기 → 상규 도면뷰어</b>를 고르면 바로 열려요. 파일 관리자에서 DWG 파일을 눌러도 돼요.
    </div>
  </div>
</main>

<!-- 도면 화면 -->
<section id="viewer" hidden>
  <canvas id="cv"></canvas>
  <canvas id="ink"></canvas>
  <header class="topbar">
    <button id="btnHome" class="ico" aria-label="처음 화면"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="title"><div id="fname" class="fname"></div><div id="finfo" class="finfo"></div></div>
    <button id="btnBg" class="ico" aria-label="배경색 바꾸기"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
    <button id="btnFit" class="ico" aria-label="전체 보기"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="btnClean" class="ico" aria-label="도면만 보기"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 9h18M3 15h18" stroke="currentColor" stroke-width="2" stroke-dasharray="2 2.4"/><path d="M8 12h8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
  </header>

  <div id="mpanel" class="mpanel" hidden>
    <div class="mrow">
      <div class="mval"><div id="mlabel" class="mlabel">거리</div><div id="mmain" class="mmain">점을 찍어 주세요</div><div id="msub" class="msub"></div></div>
      <select id="unit" aria-label="도면 단위">
        <option value="mm">mm</option><option value="cm">cm</option><option value="m">m</option><option value="in">inch</option><option value="ft">feet</option>
      </select>
    </div>
    <div class="mbtns">
      <button id="mUndo">점 취소</button>
      <button id="mDone">완료</button>
      <button id="mClear">모두 지우기</button>
      <button id="mSnap" class="toggle on" aria-pressed="true">스냅</button>
    </div>
  </div>

  <div id="kpanel" class="mpanel kpanel" hidden>
    <div class="krow">
      <div class="seg ktools" data-k="tool">
        <button data-v="pen" class="on">펜</button><button data-v="hl">형광펜</button><button data-v="cloud">구름</button><button data-v="arrow">화살표</button><button data-v="leader">지시선</button><button data-v="text">글자</button><button data-v="blk">블럭</button><button data-v="erase">지우개</button>
      </div>
    </div>
    <div id="kblk" class="kblk" hidden><button data-b="4way" class="on"><svg viewBox="-24 -24 168 168" aria-hidden="true"><rect x="0" y="0" width="120" height="120" rx="6" fill="currentColor" fill-opacity=".15" stroke="currentColor" stroke-width="6"/><path d="M60 -20 L51 -8 L69 -8 Z M60 140 L51 128 L69 128 Z M-20 60 L-8 51 L-8 69 Z M140 60 L128 51 L128 69 Z" fill="currentColor"/><text x="60" y="62" fill="currentColor" font-size="34" font-weight="800" text-anchor="middle" dominant-baseline="central">4W</text></svg><span>4WAY</span></button><button data-b="1way"><svg viewBox="-10 -14 160 96" aria-hidden="true"><rect x="0" y="0" width="140" height="50" rx="5" fill="currentColor" fill-opacity=".15" stroke="currentColor" stroke-width="5"/><path d="M40 76 L32 62 L48 62 Z M70 76 L62 62 L78 62 Z M100 76 L92 62 L108 62 Z" fill="currentColor"/><text x="70" y="26" fill="currentColor" font-size="26" font-weight="800" text-anchor="middle" dominant-baseline="central">1W</text></svg><span>1WAY</span></button><button data-b="wall"><svg viewBox="-10 -22 160 104" aria-hidden="true"><path d="M-10 -6 H150" stroke="currentColor" stroke-width="5"/><rect x="0" y="0" width="140" height="38" rx="10" fill="currentColor" fill-opacity=".15" stroke="currentColor" stroke-width="5"/><path d="M45 72 L37 58 L53 58 Z M70 76 L62 62 L78 62 Z M95 72 L87 58 L103 58 Z" fill="currentColor"/></svg><span>벽걸이</span></button><button data-b="stand"><svg viewBox="-12 -12 124 118" aria-hidden="true"><rect x="0" y="0" width="100" height="70" rx="14" fill="currentColor" fill-opacity=".15" stroke="currentColor" stroke-width="5"/><path d="M12 56H88" stroke="currentColor" stroke-width="4"/><path d="M30 100L22 86L38 86Z M50 104L42 90L58 90Z M70 100L62 86L78 86Z" fill="currentColor"/></svg><span>스탠드 600</span></button><button data-b="stand2"><svg viewBox="-12 -12 204 112" aria-hidden="true"><rect x="0" y="0" width="180" height="60" rx="14" fill="currentColor" fill-opacity=".15" stroke="currentColor" stroke-width="6"/><path d="M14 48H166" stroke="currentColor" stroke-width="4"/><path d="M45 88L37 74L53 74Z M90 92L82 78L98 78Z M135 88L127 74L143 74Z" fill="currentColor"/></svg><span>스탠드 1200</span></button><button data-b="duct"><svg viewBox="-20 -44 190 166" aria-hidden="true"><rect x="0" y="0" width="150" height="80" fill="currentColor" fill-opacity=".15" stroke="currentColor" stroke-width="5" stroke-dasharray="14 8"/><path d="M45 -16h60v16h-60Z M45 80h60v16h-60Z" fill="none" stroke="currentColor" stroke-width="5"/><path d="M75 -18L66 -32L84 -32Z M75 120L66 106L84 106Z" fill="currentColor"/></svg><span>덕트</span></button><button data-b="out"><svg viewBox="-8 -8 166 76" aria-hidden="true"><rect x="0" y="0" width="150" height="60" rx="3" fill="currentColor" fill-opacity=".15" stroke="currentColor" stroke-width="5"/><circle cx="40" cy="30" r="24" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="40" cy="30" r="12" fill="none" stroke="currentColor" stroke-width="3"/><path d="M16 30H64M40 6V54M80 5V55M88 30H142M88 44H142" stroke="currentColor" stroke-width="3"/></svg><span>실외기</span></button><button data-b="outtop"><svg viewBox="-6 -6 148 96" aria-hidden="true"><rect x="0" y="0" width="136" height="84" rx="3" fill="currentColor" fill-opacity=".15" stroke="currentColor" stroke-width="5"/><circle cx="36" cy="36" r="26" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="100" cy="36" r="26" fill="none" stroke="currentColor" stroke-width="4"/><path d="M10 36H62M36 10V62M74 36H126M100 10V62M5 70H131" stroke="currentColor" stroke-width="3"/></svg><span>상부토출</span></button></div>
    <div class="krow">
      <div class="colors">
        <button data-c="fg" style="--c:#F2F4F5" aria-label="검정/흰색"></button>
        <button data-c="#E03131" class="on" style="--c:#E03131" aria-label="빨강"></button>
        <button data-c="#1C7ED6" style="--c:#1C7ED6" aria-label="파랑"></button>
        <button data-c="#2F9E44" style="--c:#2F9E44" aria-label="초록"></button>
        <button data-c="#F08C00" style="--c:#F08C00" aria-label="주황"></button>
        <button data-c="#FAB005" style="--c:#FAB005" aria-label="노랑"></button>
      </div>
      <div class="seg ksize" data-k="size"><button data-v="0" aria-label="가늘게"><i style="--d:4px"></i></button><button data-v="1" class="on" aria-label="보통"><i style="--d:7px"></i></button><button data-v="2" aria-label="굵게"><i style="--d:11px"></i></button></div>
      <input id="blkLabel" class="blklabel" placeholder="이름 (예: 23kW)" aria-label="블럭 이름" hidden>
    </div>
    <div class="mbtns">
      <button id="kUndo">되돌리기</button>
      <button id="kClear">모두 지우기</button>
      <button id="kPen" class="toggle wide" aria-pressed="false">S펜 전용</button>
    </div>
    <div id="khint" class="msub khint"></div>
  </div>
  <div id="blkbar" class="blkbar" hidden>
    <button data-a="rot">↻ 90°</button><button data-a="name">이름</button><button data-a="dup">복제</button><button data-a="del" class="danger">삭제</button>
  </div>

  <nav class="tools">
    <button data-mode="pan" class="on"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg><span>보기</span></button>
    <button data-mode="dist"><svg viewBox="0 0 24 24"><path d="M3 17L17 3l4 4L7 21z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg><span>거리</span></button>
    <button data-mode="area"><svg viewBox="0 0 24 24"><path d="M4 6l9-2 7 7-4 9-12-3z" fill="currentColor" fill-opacity=".25" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg><span>면적</span></button>
    <button data-mode="mark"><svg viewBox="0 0 24 24"><path d="M4 20l1.2-4.6L16.5 4.1a2 2 0 0 1 2.8 0l.6.6a2 2 0 0 1 0 2.8L8.6 18.8z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M14 6.6l3.4 3.4" stroke="currentColor" stroke-width="1.9"/></svg><span>메모</span></button>
    <button id="btnExport"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 17v3h16v-3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg><span>내보내기</span></button>
  </nav>
  <button id="btnUnclean" class="unclean" aria-label="메뉴 다시 보기" hidden><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
  <canvas id="loupe" hidden></canvas>
</section>

<!-- 내보내기 -->
<div id="sheetBack" class="sheetback" hidden></div>
<div id="sheet" class="sheet" hidden>
  <div class="grab"></div>
  <h3>내보내기</h3>
  <div class="opt"><span>형식</span><div class="seg" data-k="fmt"><button data-v="pdf" class="on">PDF</button><button data-v="png">사진(PNG)</button></div></div>
  <div class="opt"><span>범위</span><div class="seg" data-k="range"><button data-v="view" class="on">지금 화면</button><button data-v="all">도면 전체</button></div></div>
  <div class="opt" id="optPaper"><span>용지</span><div class="seg" data-k="paper"><button data-v="a4" class="on">A4</button><button data-v="a3">A3</button></div></div>
  <div class="opt"><span>배경</span><div class="seg" data-k="bg"><button data-v="white" class="on">흰색(인쇄용)</button><button data-v="screen">화면과 같게</button></div></div>
  <div class="opt"><span>측정·메모</span><div class="seg" data-k="meas"><button data-v="1" class="on">넣기</button><button data-v="0">빼기</button></div></div>
  <div class="actions">
    <button id="exSave" class="big">저장</button>
    <button id="exShare" class="big alt">공유(카톡 등)</button>
  </div>
</div>

 <!-- 글자 메모 입력 -->
<div id="noteBack" class="sheetback" hidden></div>
<div id="note" class="sheet" hidden>
  <div class="grab"></div>
  <h3 id="noteTitle">글자 메모</h3>
  <textarea id="noteText" rows="3" placeholder="예) 이 벽 300 → 250으로 변경"></textarea>
  <div class="actions three">
    <button id="noteDel" class="big alt">삭제</button>
    <button id="noteCancel" class="big alt">취소</button>
    <button id="noteOk" class="big">넣기</button>
  </div>
</div>

<div id="dlgBack" class="sheetback" hidden></div>
<div id="dlg" class="dlg" role="dialog" aria-modal="true" hidden>
  <h3 id="dlgT"></h3>
  <p id="dlgM"></p>
  <div class="actions"><button id="dlgNo" class="big alt">취소</button><button id="dlgOk" class="big">확인</button></div>
</div>

<div id="busy" class="busy" hidden><div class="spin"></div><div id="busyText">도면 여는 중…</div></div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="file" accept=".dwg,.dxf,.DWG,.DXF" hidden>
<input type="file" id="photoFile" accept="image/*" hidden disabled>

<script src="vendor/jspdf.umd.min.js" defer></script>
<script src="vendor/perfect-freehand.js"></script>
<script src="app.js"></script>
</body>
</html>
