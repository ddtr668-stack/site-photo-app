<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14181B">
<title>상규 도면뷰어</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- 첫 화면 -->
<main id="home">
  <div class="home-in">
    <div class="brand">
      <svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><rect x="2" y="2" width="44" height="44" rx="11" fill="#F0B400"/><path d="M12 34V14h12l12 12v8z" fill="none" stroke="#14181B" stroke-width="3" stroke-linejoin="round"/><path d="M24 14v12h12" fill="none" stroke="#14181B" stroke-width="3" stroke-linejoin="round"/><path d="M12 38h24" stroke="#14181B" stroke-width="3" stroke-linecap="round"/></svg>
      <div>
        <h1>상규 도면뷰어</h1>
        <p class="sub">DWG · DXF 보기 · 거리/면적 재기 · PDF로 저장</p>
      </div>
    </div>
    <button id="btnOpen" class="big">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      도면 파일 열기
    </button>
    <section>
      <h2>최근 도면</h2>
      <ul id="recent" class="recent"></ul>
      <p id="recentEmpty" class="empty">아직 연 도면이 없어요.</p>
    </section>
    <div class="tip">
      <b>카톡으로 받은 도면</b>은 파일을 누른 뒤 <b>다른 앱으로 열기 → 상규 도면뷰어</b>를 고르면 바로 열려요. 파일 관리자에서 DWG 파일을 눌러도 돼요.
    </div>
  </div>
</main>

<!-- 도면 화면 -->
<section id="viewer" hidden>
  <canvas id="cv"></canvas>
  <canvas id="ink"></canvas>
  <header class="topbar">
    <button id="btnHome" class="ico" aria-label="처음 화면"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="title"><div id="fname" class="fname"></div><div id="finfo" class="finfo"></div></div>
    <button id="btnBg" class="ico" aria-label="배경색 바꾸기"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
    <button id="btnFit" class="ico" aria-label="전체 보기"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="btnClean" class="ico" aria-label="도면만 보기"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 9h18M3 15h18" stroke="currentColor" stroke-width="2" stroke-dasharray="2 2.4"/><path d="M8 12h8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
  </header>

  <div id="mpanel" class="mpanel" hidden>
    <div class="mrow">
      <div class="mval"><div id="mlabel" class="mlabel">거리</div><div id="mmain" class="mmain">점을 찍어 주세요</div><div id="msub" class="msub"></div></div>
      <select id="unit" aria-label="도면 단위">
        <option value="mm">mm</option><option value="cm">cm</option><option value="m">m</option><option value="in">inch</option><option value="ft">feet</option>
      </select>
    </div>
    <div class="mbtns">
      <button id="mUndo">점 취소</button>
      <button id="mDone">완료</button>
      <button id="mClear">모두 지우기</button>
      <button id="mSnap" class="toggle on" aria-pressed="true">스냅</button>
    </div>
  </div>

  <div id="kpanel" class="mpanel kpanel" hidden>
    <div class="krow">
      <div class="seg ktools" data-k="tool">
        <button data-v="pen" class="on">펜</button><button data-v="hl">형광펜</button><button data-v="cloud">구름</button><button data-v="arrow">화살표</button><button data-v="leader">지시선</button><button data-v="text">글자</button><button data-v="blk">블럭</button><button data-v="erase">지우개</button>
      </div>
    </div>
    <div id="kblk" class="kblk" hidden><button data-b="4way" class="on"><svg viewBox="-13.3 -13.3 121.6 121.6" aria-hidden="true"><path d="M2.5 0H92.5A2.5 2.5 0 0 1 95 2.5V92.5A2.5 2.5 0 0 1 92.5 95H2.5A2.5 2.5 0 0 1 0 92.5V2.5A2.5 2.5 0 0 1 2.5 0Z" fill="currentColor" fill-opacity=".15" stroke="currentColor" stroke-width="4.32" stroke-linejoin="round"/><path d="M20 13H75A7 7 0 0 1 82 20V75A7 7 0 0 1 75 82H20A7 7 0 0 1 13 75V20A7 7 0 0 1 20 13Z" fill="none" stroke="currentColor" stroke-width="3.45" stroke-linejoin="round"/><path d="M25.5 24H69.5A1.5 1.5 0 0 1 71 25.5V69.5A1.5 1.5 0 0 1 69.5 71H25.5A1.5 1.5 0 0 1 24 69.5V25.5A1.5 1.5 0 0 1 25.5 24Z" fill="none" stroke="currentColor" stroke-width="3.02" stroke-linejoin="round"/><path d="M30 -2L30 -11M31.71 -8.3L30 -11L28.29 -8.3M30 97L30 106M28.29 103.3L30 106L31.71 103.3M65 -2L65 -11M66.71 -8.3L65 -11L63.29 -8.3M65 97L65 106M63.29 103.3L65 106L66.71 103.3M-2 30L-11 30M-8.3 28.29L-11 30L-8.3 31.71M97 30L106 30M103.3 31.71L106 30L103.3 28.29M-2 65L-11 65M-8.3 63.29L-11 65L-8.3 66.71M97 65L106 65M103.3 66.71L106 65L103.3 63.29" fill="none" stroke="currentColor" stroke-width="3.45" stroke-linejoin="round"/></svg><span>4WAY</span></button><button data-b="1way"><svg viewBox="-16.8 -16.8 153.6 79.6" aria-hidden="true"><path d="M3 0H117A3 3 0 0 1 120 3V43A3 3 0 0 1 117 46H3A3 3 0 0 1 0 43V3A3 3 0 0 1 3 0Z" fill="currentColor" fill-opacity=".15" stroke="currentColor" stroke-width="5.45" stroke-linejoin="round"/><path d="M3 11H117" fill="none" stroke="currentColor" stroke-width="3.27" stroke-linejoin="round"/><path d="M8 14H112L104.5 42H15.5Z" fill="none" stroke="currentColor" stroke-width="3.82" stroke-linejoin="round"/><path d="M35 48L35 58M33.29 55.3L35 58L36.71 55.3M60 48L60 58M58.29 55.3L60 58L61.71 55.3M85 48L85 58M83.29 55.3L85 58L86.71 55.3" fill="none" stroke="currentColor" stroke-width="4.36" stroke-linejoin="round"/></svg><span>1WAY</span></button><button data-b="wall"><svg viewBox="-10 -22 160 104" aria-hidden="true"><path d="M-10 -6 H150" stroke="currentColor" stroke-width="5"/><rect x="0" y="0" width="140" height="38" rx="10" fill="currentColor" fill-opacity=".15" stroke="currentColor" stroke-width="5"/><path d="M45 72 L37 58 L53 58 Z M70 76 L62 62 L78 62 Z M95 72 L87 58 L103 58 Z" fill="currentColor"/></svg><span>벽걸이</span></button><button data-b="stand"><svg viewBox="-7.4 -7.4 67.2 46.7" aria-hidden="true"><path d="M2.5 0H50L52.5 2.5V25.5H0V2.5Z" fill="currentColor" fill-opacity=".15" stroke="currentColor" stroke-width="2.39" stroke-linejoin="round"/><path d="M0 25.5V29.5Q0 32 2.5 32H50Q52.5 32 52.5 29.5V25.5" fill="none" stroke="currentColor" stroke-width="2.39" stroke-linejoin="round"/><path d="M6.8 4.5H45.7A1.8 1.8 0 0 1 47.5 6.3V9.18A1.8 1.8 0 0 1 45.7 10.98H6.8A1.8 1.8 0 0 1 5 9.18V6.3A1.8 1.8 0 0 1 6.8 4.5ZM6.8 13.48H45.7A1.8 1.8 0 0 1 47.5 15.29V20.2A1.8 1.8 0 0 1 45.7 22H6.8A1.8 1.8 0 0 1 5 20.2V15.29A1.8 1.8 0 0 1 6.8 13.48Z" fill="none" stroke="currentColor" stroke-width="1.67" stroke-linejoin="round"/><path d="M13.13 -2L13.13 -11M14.84 -8.3L13.13 -11L11.41 -8.3M26.25 -2L26.25 -11M27.96 -8.3L26.25 -11L24.54 -8.3M39.38 -2L39.38 -11M41.09 -8.3L39.38 -11L37.66 -8.3M-2 7.74L-9.5 7.74M-6.8 6.03L-9.5 7.74L-6.8 9.46M-2 17.74L-9.5 17.74M-6.8 16.03L-9.5 17.74L-6.8 19.46M54.5 7.74L62 7.74M59.3 9.46L62 7.74L59.3 6.03M54.5 17.74L62 17.74M59.3 19.46L62 17.74L59.3 16.03" fill="none" stroke="currentColor" stroke-width="1.91" stroke-linejoin="round"/></svg><span>스탠드</span></button><button data-b="stand2"><svg viewBox="-15.4 -15.4 140.8 79.3" aria-hidden="true"><path d="M0 0H110V42H0Z" fill="currentColor" fill-opacity=".15" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/><path d="M0 42V46Q0 48.5 2.5 48.5H107.5Q110 48.5 110 46V42" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/><path d="M10.8 6.3H99.2A1.8 1.8 0 0 1 101 8.1V9.96A1.8 1.8 0 0 1 99.2 11.76H10.8A1.8 1.8 0 0 1 9 9.96V8.1A1.8 1.8 0 0 1 10.8 6.3ZM10.8 26.04H99.2A1.8 1.8 0 0 1 101 27.84V29.7A1.8 1.8 0 0 1 99.2 31.5H10.8A1.8 1.8 0 0 1 9 29.7V27.84A1.8 1.8 0 0 1 10.8 26.04Z" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/><path d="M22 -2L22 -11M23.71 -8.3L22 -11L20.29 -8.3M44 -2L44 -11M45.71 -8.3L44 -11L42.29 -8.3M66 -2L66 -11M67.71 -8.3L66 -11L64.29 -8.3M88 -2L88 -11M89.71 -8.3L88 -11L86.29 -8.3M-2 9.03L-9.5 9.03M-6.8 7.32L-9.5 9.03L-6.8 10.74M-2 28.77L-9.5 28.77M-6.8 27.06L-9.5 28.77L-6.8 30.48M112 9.03L119.5 9.03M116.8 10.74L119.5 9.03L116.8 7.32M112 28.77L119.5 28.77M116.8 30.48L119.5 28.77L116.8 27.06" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/></svg><span>스탠드 1100</span></button><button data-b="duct"><svg viewBox="-20 -44 190 166" aria-hidden="true"><rect x="0" y="0" width="150" height="80" fill="currentColor" fill-opacity=".15" stroke="currentColor" stroke-width="5" stroke-dasharray="14 8"/><path d="M45 -16h60v16h-60Z M45 80h60v16h-60Z" fill="none" stroke="currentColor" stroke-width="5"/><path d="M75 -18L66 -32L84 -32Z M75 120L66 106L84 106Z" fill="currentColor"/></svg><span>덕트</span></button><button data-b="out"><svg viewBox="-13.2 -13.2 120.3 59.3" aria-hidden="true"><path d="M1.8 0H92.2A1.8 1.8 0 0 1 94 1.8V31.2A1.8 1.8 0 0 1 92.2 33H1.8A1.8 1.8 0 0 1 0 31.2V1.8A1.8 1.8 0 0 1 1.8 0Z" fill="currentColor" fill-opacity=".15" stroke="currentColor" stroke-width="4.27" stroke-linejoin="round"/><path d="M7 4H87L90 7V26L87 29H7L4 26V7Z" fill="none" stroke="currentColor" stroke-width="2.99" stroke-linejoin="round"/><path d="M8 0V-2.4H15V0M79 0V-2.4H86V0M8 33V35.4H15V33M79 33V35.4H86V33" fill="none" stroke="currentColor" stroke-width="2.99" stroke-linejoin="round"/><path d="M28.2 37.5L28.2 46.5M26.49 43.8L28.2 46.5L29.91 43.8M47 37.5L47 46.5M45.29 43.8L47 46.5L48.71 43.8M65.8 37.5L65.8 46.5M64.09 43.8L65.8 46.5L67.51 43.8" fill="none" stroke="currentColor" stroke-width="3.42" stroke-linejoin="round"/></svg><span>전면토출</span></button><button data-b="outtop"><svg viewBox="-18.1 -18.1 165.8 112.8" aria-hidden="true"><path d="M2 0H127.5A2 2 0 0 1 129.5 2V74.5A2 2 0 0 1 127.5 76.5H2A2 2 0 0 1 0 74.5V2A2 2 0 0 1 2 0Z" fill="currentColor" fill-opacity=".15" stroke="currentColor" stroke-width="5.89" stroke-linejoin="round"/><path d="M64.75 0V76.5" fill="none" stroke="currentColor" stroke-width="4.71" stroke-linejoin="round"/><path d="M4.88 35a27.5 27.5 0 1 0 55 0a27.5 27.5 0 1 0 -55 0M24.88 35a7.5 7.5 0 1 0 15 0a7.5 7.5 0 1 0 -15 0M69.63 35a27.5 27.5 0 1 0 55 0a27.5 27.5 0 1 0 -55 0M89.63 35a7.5 7.5 0 1 0 15 0a7.5 7.5 0 1 0 -15 0" fill="none" stroke="currentColor" stroke-width="4.71" stroke-linejoin="round"/></svg><span>상부토출</span></button></div>
    <div class="krow">
      <div class="colors">
        <button data-c="fg" style="--c:#F2F4F5" aria-label="검정/흰색"></button>
        <button data-c="#E03131" class="on" style="--c:#E03131" aria-label="빨강"></button>
        <button data-c="#1C7ED6" style="--c:#1C7ED6" aria-label="파랑"></button>
        <button data-c="#2F9E44" style="--c:#2F9E44" aria-label="초록"></button>
        <button data-c="#F08C00" style="--c:#F08C00" aria-label="주황"></button>
        <button data-c="#FAB005" style="--c:#FAB005" aria-label="노랑"></button>
      </div>
      <div class="seg ksize" data-k="size"><button data-v="0" aria-label="가늘게"><i style="--d:4px"></i></button><button data-v="1" class="on" aria-label="보통"><i style="--d:7px"></i></button><button data-v="2" aria-label="굵게"><i style="--d:11px"></i></button></div>
      <input id="blkLabel" class="blklabel" placeholder="이름 (예: 23kW)" aria-label="블럭 이름" hidden>
    </div>
    <div class="mbtns">
      <button id="kUndo">되돌리기</button>
      <button id="kClear">모두 지우기</button>
      <button id="kPen" class="toggle wide" aria-pressed="false">S펜 전용</button>
    </div>
    <div id="khint" class="msub khint"></div>
  </div>
  <div id="blkbar" class="blkbar" hidden>
    <button data-a="rot">↻ 90°</button><button data-a="name">이름</button><button data-a="dup">복제</button><button data-a="del" class="danger">삭제</button>
  </div>

  <nav class="tools">
    <button data-mode="pan" class="on"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg><span>보기</span></button>
    <button data-mode="dist"><svg viewBox="0 0 24 24"><path d="M3 17L17 3l4 4L7 21z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg><span>거리</span></button>
    <button data-mode="area"><svg viewBox="0 0 24 24"><path d="M4 6l9-2 7 7-4 9-12-3z" fill="currentColor" fill-opacity=".25" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg><span>면적</span></button>
    <button data-mode="mark"><svg viewBox="0 0 24 24"><path d="M4 20l1.2-4.6L16.5 4.1a2 2 0 0 1 2.8 0l.6.6a2 2 0 0 1 0 2.8L8.6 18.8z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M14 6.6l3.4 3.4" stroke="currentColor" stroke-width="1.9"/></svg><span>메모</span></button>
    <button id="btnExport"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 17v3h16v-3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg><span>내보내기</span></button>
  </nav>
  <button id="btnUnclean" class="unclean" aria-label="메뉴 다시 보기" hidden><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
  <canvas id="loupe" hidden></canvas>
</section>

<!-- 내보내기 -->
<div id="sheetBack" class="sheetback" hidden></div>
<div id="sheet" class="sheet" hidden>
  <div class="grab"></div>
  <h3>내보내기</h3>
  <div class="opt"><span>형식</span><div class="seg" data-k="fmt"><button data-v="pdf" class="on">PDF</button><button data-v="png">사진(PNG)</button></div></div>
  <div class="opt"><span>범위</span><div class="seg" data-k="range"><button data-v="view" class="on">지금 화면</button><button data-v="all">도면 전체</button></div></div>
  <div class="opt" id="optPaper"><span>용지</span><div class="seg" data-k="paper"><button data-v="a4" class="on">A4</button><button data-v="a3">A3</button></div></div>
  <div class="opt"><span>배경</span><div class="seg" data-k="bg"><button data-v="white" class="on">흰색(인쇄용)</button><button data-v="screen">화면과 같게</button></div></div>
  <div class="opt"><span>측정·메모</span><div class="seg" data-k="meas"><button data-v="1" class="on">넣기</button><button data-v="0">빼기</button></div></div>
  <div class="actions">
    <button id="exSave" class="big">저장</button>
    <button id="exShare" class="big alt">공유(카톡 등)</button>
  </div>
</div>

 <!-- 글자 메모 입력 -->
<div id="noteBack" class="sheetback" hidden></div>
<div id="note" class="sheet" hidden>
  <div class="grab"></div>
  <h3 id="noteTitle">글자 메모</h3>
  <textarea id="noteText" rows="3" placeholder="예) 이 벽 300 → 250으로 변경"></textarea>
  <div class="actions three">
    <button id="noteDel" class="big alt">삭제</button>
    <button id="noteCancel" class="big alt">취소</button>
    <button id="noteOk" class="big">넣기</button>
  </div>
</div>

<div id="dlgBack" class="sheetback" hidden></div>
<div id="dlg" class="dlg" role="dialog" aria-modal="true" hidden>
  <h3 id="dlgT"></h3>
  <p id="dlgM"></p>
  <div class="actions"><button id="dlgNo" class="big alt">취소</button><button id="dlgOk" class="big">확인</button></div>
</div>

<div id="busy" class="busy" hidden><img id="busyImg" class="busyimg" alt="" hidden><div class="spin"></div><div id="busyText">도면 여는 중…</div></div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="file" accept=".dwg,.dxf,.DWG,.DXF" hidden>
<input type="file" id="photoFile" accept="image/*" hidden disabled>

<script src="vendor/jspdf.umd.min.js" defer></script>
<script src="vendor/perfect-freehand.js"></script>
<script src="app.js"></script>
</body>
</html>
